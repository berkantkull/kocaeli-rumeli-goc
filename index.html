<title>Koca-ili'den Rumeli'ye</title>

<style>

    --bg: #f7f5f0;
    --panel: #ffffff;
    --text: #22201c;
    --muted: #6b665c;
    --border: #e2ddd2;
    --kocaeli: #b4472f;
    --suleyman: #2f5f8a;
    --murad: #2e7d5b;
    --hover: #f1ede4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a18;
      --panel: #252421;
      --text: #ece8df;
      --muted: #a39d90;
      --border: #3a3833;
      --kocaeli: #e07a5f;
      --suleyman: #7fb0dc;
      --murad: #6cc59a;
      --hover: #2f2d29;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a18;
    --panel: #252421;
    --text: #ece8df;
    --muted: #a39d90;
    --border: #3a3833;
    --kocaeli: #e07a5f;
    --suleyman: #7fb0dc;
    --murad: #6cc59a;
    --hover: #2f2d29;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 650; }
  header p { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }
  main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; min-height: 300px; }
  aside {
    width: 400px;
    max-width: 100%;
    overflow-y: auto;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 16px 20px;
  }
  aside h2 { font-size: 1rem; margin: 0 0 4px; }
  aside h3 { font-size: .8rem; margin: 18px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  aside .alt { color: var(--muted); font-size: .82rem; margin: 0 0 12px; line-height: 1.45; }
  .filtre { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .filtre-baslik { font-size: .75rem; color: var(--muted); margin: 0 0 4px; }
  .filtre button {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: .8rem;
    cursor: pointer;
  }
  .filtre button.aktif { background: var(--text); border-color: var(--text); color: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; }
  td.sayi { text-align: right; font-variant-numeric: tabular-nums; }
  tr.tik { cursor: pointer; }
  tr.tik:hover { background: var(--hover); }
  .etiket { color: var(--muted); font-size: .78rem; }
  .not {
    margin-top: 16px;
    font-size: .78rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    line-height: 1.45;
  }
  .lejant { display: flex; gap: 14px; font-size: .8rem; margin-bottom: 12px; flex-wrap: wrap; }
  .lejant span::before {
    content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 5px; vertical-align: -1px;
  }
  .lejant .k::before { background: var(--kocaeli); }
  .lejant .s::before { background: var(--suleyman); }
  .lejant .m::before { background: var(--murad); }
  .ozet-kutular { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 14px; }
  .ozet-kutular div { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .ozet-kutular b { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .ozet-kutular span { font-size: .75rem; color: var(--muted); }
  .geri { background: none; border: none; color: var(--suleyman); padding: 0; cursor: pointer; font-size: .82rem; margin-bottom: 8px; }
  .leaflet-tooltip.etiket-harita {
    background: transparent; border: none; box-shadow: none;
    font-weight: 600; font-size: 12px; color: #222;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
  }
  .leaflet-tooltip.etiket-harita::before { display: none; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #map { flex: none; height: 55vh; }
    aside { width: 100%; border-left: none; border-top: 1px solid var(--border); padding: 14px 16px; }
    header { padding: 12px 16px; }
  }
</style>
</head>

const css = getComputedStyle(document.documentElement);
const renk = (ad) => css.getPropertyValue(ad).trim();
const donemRengi = (r) => renk(DONEMLER[RUMELI[r].donem].renk);

const map = L.map("map", { zoomSnap: 0.25 });
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Harita altlığı &copy; Esri",
  maxZoom: 12,
}).addTo(map);

let secilenKocaeli = null;
let secilenDonem = null;

const koyGorunur = ([r, , e]) =>
  (!secilenDonem || RUMELI[r].donem === secilenDonem) && (!secilenKocaeli || e[secilenKocaeli]);
const gorunenKoyler = () => KOYLER.filter(koyGorunur);

const cizgiKatmani = L.layerGroup().addTo(map);
const noktaKatmani = L.layerGroup().addTo(map);

// Çizgiyi hafifçe kavisli çizmek için basit bir ikinci derece eğri
function kavis(a, b) {
  const pts = [];
  const orta = [(a[0] + b[0]) / 2 + 0.35, (a[1] + b[1]) / 2];
  for (let t = 0; t <= 1.0001; t += 0.05) {
    const lat = (1 - t) ** 2 * a[0] + 2 * (1 - t) * t * orta[0] + t ** 2 * b[0];
    const lng = (1 - t) ** 2 * a[1] + 2 * (1 - t) * t * orta[1] + t ** 2 * b[1];
    pts.push([lat, lng]);
  }
  return pts;
}

function ciz() {
  cizgiKatmani.clearLayers();
  noktaKatmani.clearLayers();

  // Rumeli nahiyesi x Kocaeli nahiyesi -> köyler
  const baglar = {};
  for (const [r, koy, e] of gorunenKoyler()) {
    for (const k of Object.keys(e)) {
      if (secilenKocaeli && k !== secilenKocaeli) continue;
      (baglar[r + "|" + k] ||= []).push(koy);
    }
  }

  for (const [anahtar, koyler] of Object.entries(baglar)) {
    const [r, k] = anahtar.split("|");
    L.polyline(kavis([KOCAELI[k].lat, KOCAELI[k].lng], [RUMELI[r].lat, RUMELI[r].lng]), {
      color: donemRengi(r),
      weight: 1 + koyler.length * 1.1,
      opacity: secilenKocaeli ? 0.7 : 0.3,
    })
      .bindTooltip(`${KOCAELI[k].ad} → ${RUMELI[r].ad}: ${koyler.length} köy`, { sticky: true })
      .addTo(cizgiKatmani);
  }

  const rumeliSayilari = {};
  for (const [r] of gorunenKoyler()) rumeliSayilari[r] = (rumeliSayilari[r] || 0) + 1;

  for (const [id, n] of Object.entries(RUMELI)) {
    const sayi = rumeliSayilari[id] || 0;
    if (!sayi) continue;
    L.circleMarker([n.lat, n.lng], {
      radius: 5 + Math.sqrt(sayi) * 2.2,
      color: "#fff", weight: 1.5,
      fillColor: donemRengi(id), fillOpacity: 0.95,
      dashArray: n.yaklasik ? "3 3" : null,
    })
      .bindTooltip(n.ad, { permanent: true, direction: "right", className: "etiket-harita", offset: [6, 0] })
      .on("click", () => rumeliDetay(id))
      .addTo(noktaKatmani);
  }

  for (const [id, n] of Object.entries(KOCAELI)) {
    const sayi = KOYLER.filter(([r, , e]) => e[id] && (!secilenDonem || RUMELI[r].donem === secilenDonem)).length;
    const soluk = secilenKocaeli && secilenKocaeli !== id;
    L.circleMarker([n.lat, n.lng], {
      radius: 5 + Math.sqrt(sayi) * 1.6,
      color: "#fff", weight: 1.5,
      fillColor: renk("--kocaeli"), fillOpacity: soluk ? 0.3 : 0.95,
    })
      .bindTooltip(n.ad, { permanent: true, direction: "right", className: "etiket-harita", offset: [6, 0] })
      .on("click", () => {
        secilenKocaeli = id;
        ciz();
        kocaeliDetay(id);
      })
      .addTo(noktaKatmani);
  }
}

// YAN PANEL
// ---------------------------------------------------------------------------
const panel = document.getElementById("panel");
let aktifGorunum = () => ozet();

function filtreler() {
  const btn = (tur, id, ad, aktif) =>
    `<button data-tur="${tur}" data-id="${id}" class="${aktif ? "aktif" : ""}">${ad}</button>`;
  return `
    <p class="filtre-baslik">Dönem</p>
    <div class="filtre">
      ${btn("donem", "", "Tümü", !secilenDonem)}
      ${Object.entries(DONEMLER).map(([id, d]) => btn("donem", id, d.ad, secilenDonem === id)).join("")}
    </div>
    <p class="filtre-baslik">Kocaeli nahiyesi</p>
    <div class="filtre">
      ${btn("kocaeli", "", "Tümü", !secilenKocaeli)}
      ${Object.entries(KOCAELI).map(([id, n]) => btn("kocaeli", id, n.ad, secilenKocaeli === id)).join("")}
    </div>`;
}

function baglaFiltre() {
  panel.querySelectorAll(".filtre button").forEach((b) =>
    b.addEventListener("click", () => {
      const deger = b.dataset.id || null;
      if (b.dataset.tur === "donem") secilenDonem = deger;
      else secilenKocaeli = deger;
      ciz();
      if (b.dataset.tur === "kocaeli") secilenKocaeli ? kocaeliDetay(secilenKocaeli) : ozet();
      else aktifGorunum();
    })
  );
}

function eslesmeHucresi(e, not) {
  if (not) return `<span class="etiket">${not}</span>`;
  return Object.entries(e).map(([k, ad]) => `${ad} <span class="etiket">(${KOCAELI[k].ad})</span>`).join("<br>");
}

function ozet() {
  aktifGorunum = ozet;
  const koyler = gorunenKoyler();
  const bolgeler = {};
  for (const [id, n] of Object.entries(RUMELI)) {
    const s = koyler.filter(([r]) => r === id).length;
    if (!s) continue;
    (bolgeler[n.bolge] ||= []).push([id, n, s]);
  }
  const bloklar = Object.entries(bolgeler)
    .map(([bolge, liste]) => {
      const toplam = liste.reduce((t, [, , s]) => t + s, 0);
      const satirlar = liste
        .sort((a, b) => b[2] - a[2])
        .map(([id, n, s]) => `<tr class="tik" data-r="${id}"><td>${n.ad}${n.yaklasik ? " <span class='etiket'>(konum yaklaşık)</span>" : ""}<br><span class="etiket">${n.bugun}</span></td><td class="sayi">${s}</td></tr>`)
        .join("");
      const makale = !secilenKocaeli && MAKALE_TOPLAMLARI[bolge];
      return `<h3>${bolge} · Tablo ${liste[0][1].tablo}</h3>
        <table><tbody>${satirlar}
        <tr><td><b>Toplam</b>${makale ? ` <span class="etiket">(makale metninde: ${makale})</span>` : ""}</td><td class="sayi"><b>${toplam}</b></td></tr>
        </tbody></table>`;
    })
    .join("");

  const nahiyeSayisi = Object.values(bolgeler).reduce((t, l) => t + l.length, 0);
  panel.innerHTML = `
    <h2>Genel bakış</h2>
    <div class="ozet-kutular">
      <div><b>${koyler.length}</b><span>köy</span></div>
      <div><b>${nahiyeSayisi}</b><span>Rumeli nahiyesi</span></div>
      <div><b>${Object.keys(bolgeler).length}</b><span>sancak / bölge</span></div>
    </div>
    <div class="lejant"><span class="k">Kocaeli nahiyesi</span><span class="s">Süleyman Paşa dönemi</span><span class="m">I. Murad dönemi</span></div>
    ${filtreler()}
    ${bloklar}
    <div class="not">Çizgi kalınlığı iki nahiye arasındaki eşleşen köy sayısını gösterir. Bir noktaya ya da satıra tıklayarak köy listesini açabilirsiniz.
    Kesikli kenarlı noktaların yeri kesin değildir. Bir Rumeli köyü birden fazla Kocaeli nahiyesindeki köyle eşleşebildiği için çizgilerin toplamı köy sayısından fazladır.
    Veri, makaledeki tablolardan aktarılmış bir taslaktır ve kontrol edilmelidir.</div>`;
  baglaFiltre();
  panel.querySelectorAll("tr.tik").forEach((tr) => tr.addEventListener("click", () => rumeliDetay(tr.dataset.r)));
}

function rumeliDetay(id) {
  aktifGorunum = () => rumeliDetay(id);
  const n = RUMELI[id];
  const koyler = KOYLER.filter(([r, , e]) => r === id && (!secilenKocaeli || e[secilenKocaeli]));
  const satirlar = koyler
    .map(([, koy, e, not]) => `<tr><td><b>${koy}</b></td><td>${eslesmeHucresi(e, not)}</td></tr>`)
    .join("");
  panel.innerHTML = `
    <button class="geri">← Genel bakış</button>
    <h2>${n.ad}</h2>
    <p class="alt">${DONEMLER[n.donem].ad} · ${n.bolge} · Tablo ${n.tablo}<br>
      Bugün: ${n.bugun}<br>
      ${koyler.length} köy${secilenKocaeli ? ` (${KOCAELI[secilenKocaeli].ad} ile eşleşen)` : ""}<br>
      Kaynak: ${n.kaynak}</p>
    <table><thead><tr><th>Rumeli'deki köy</th><th>Kocaeli'deki karşılığı</th></tr></thead><tbody>${satirlar}</tbody></table>`;
  panel.querySelector(".geri").addEventListener("click", ozet);
  map.panTo([n.lat, n.lng]);
}

function kocaeliDetay(id) {
  aktifGorunum = () => kocaeliDetay(id);
  const n = KOCAELI[id];
  const koyler = gorunenKoyler().filter(([, , e]) => e[id]);
  const satirlar = koyler
    .map(([r, koy, e]) => `<tr class="tik" data-r="${r}"><td>${e[id]}</td><td><b>${koy}</b> <span class="etiket">(${RUMELI[r].ad})</span></td></tr>`)
    .join("");
  panel.innerHTML = `
    <button class="geri">← Genel bakış</button>
    <h2>${n.ad}</h2>
    <p class="alt">Rumeli'de ${koyler.length} köyle eşleşiyor${secilenDonem ? ` (${DONEMLER[secilenDonem].ad})` : ""}</p>
    ${filtreler()}
    <table><thead><tr><th>Kocaeli'deki köy</th><th>Rumeli'deki karşılığı</th></tr></thead><tbody>${satirlar}</tbody></table>`;
  panel.querySelector(".geri").addEventListener("click", () => { secilenKocaeli = null; ciz(); ozet(); });
  baglaFiltre();
  panel.querySelectorAll("tr.tik").forEach((tr) => tr.addEventListener("click", () => rumeliDetay(tr.dataset.r)));
}

ciz();
ozet();
map.fitBounds(L.latLngBounds([...Object.values(KOCAELI), ...Object.values(RUMELI)].map((n) => [n.lat, n.lng])), { padding: [30, 30] });
</script>
</body>
</html>
